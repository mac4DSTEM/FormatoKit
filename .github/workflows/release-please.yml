# Releases: release-please keeps one Release PR open, built from the conventional-commit titles of the squash-merged PRs
# since the last tag (feat: minor before 1.0, fix: patch, feat!: minor before 1.0; docs/ci/chore/test/refactor release nothing).
# Merging the Release PR writes the CHANGELOG entry and the manifest version; the next run tags the merge commit and
# creates the GitHub release. Tags are bare versions (0.9.1), never moved.
#
# The org's release app opens the Release PR and pushes the tag (org variable RELEASE_APP_CLIENT_ID, org secret RELEASE_APP_KEY):
# a PR opened with GITHUB_TOKEN gets pull_request runs that wait for a maintainer's approval, and its tags start no
# workflows. With the app token CI runs on the Release PR like on any PR, and the tag runs the tag workflows.
# Without the app (variable unset) the job falls back to GITHUB_TOKEN and dispatches CI on the Release PR's branch. Step
# env is evaluated even when `if` skips the step, so the PR JSON is read with jq rather than fromJSON (empty on a run with
# no Release PR). Without the app the tag starts no workflow either, so the job dispatches Docs on the new tag
# (`github.ref` is then `refs/tags/<version>`, so its deploy job publishes to Pages). Needs "Allow GitHub Actions to
# create and approve pull requests".
name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - id: app
        if: vars.RELEASE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ steps.app.outputs.token || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # release-please bumps the CITATION.cff version (extra-files) but has no updater for dates: this step sets
      # date-released to the day of the run on the Release PR's branch, so the merged Release PR carries its own date.
      - name: Date CITATION.cff on the Release PR
        if: steps.release.outputs.pr
        run: |
          branch=$(jq -r .headBranchName <<<"$PR")
          git clone --quiet --depth 1 --branch "$branch" "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" release-pr
          cd release-pr
          sed -i -E "s/^date-released: \"[0-9-]+\"/date-released: \"$(date -u +%F)\"/" CITATION.cff
          if git diff --quiet; then exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898283+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -am "chore: date CITATION.cff for the release"
          git push --quiet origin "HEAD:$branch"
        env:
          PR: ${{ steps.release.outputs.pr }}
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
      - name: Run CI on the Release PR
        if: steps.release.outputs.pr && steps.app.outputs.token == ''
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$(jq -r .headBranchName <<<"$PR")"
        env:
          PR: ${{ steps.release.outputs.pr }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the docs for the new tag
        if: steps.release.outputs.release_created && steps.app.outputs.token == ''
        run: gh workflow run docs.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
        env:
          TAG: ${{ steps.release.outputs.tag_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
