# FormatoKit CI: the gate (tools/test.sh = `swift test -c release`, warning-checked) and the consumer check.
#
# The package declares macOS 15 and tools 6.2; the macos-26 image with Xcode 26.6 (Swift 6.3) is pinned below, as in docs.yml.
# The gate and the consumer check use the locally built libhdf5 XCFrameworks (FORMATO_LOCAL_XCFRAMEWORKS); the `xcframework-url`
# job resolves the release zips by URL and checksum, as a consumer does.
# No libhdf5 step: FormatoHDF5 ships it. No References/: without the RosettaSciIO clone the pins tests run on the committed
# copies of the pins and fixtures (tools/test.sh); the oracles are rerun locally, never in CI.
# Never `swift build --build-tests -c release` (fails on this toolchain's Swift Build backend); tools/test.sh is the gate.
name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned like the apps: the macos-26 image's Xcode 26.6 (Swift 6.3, macOS 26 SDK). Bump on purpose.
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  test:
    # The org's Mac runner while the org variable MACEM_MAC_RUNNER is set (never for a fork PR); else GitHub's macos-26.
    runs-on: ${{ vars.MACEM_MAC_RUNNER && !github.event.pull_request.head.repo.fork && fromJSON(vars.MACEM_MAC_RUNNER) || 'macos-26' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain on record
        run: |
          xcode-select -p
          swift --version
      - name: Gate (tools/test.sh, release)
        run: tools/test.sh
      - name: Consumer check (public API only, Debug, no warnings, libhdf5 from the package)
        run: tools/consumer-check/run.sh

  xcframework-url:
    name: libhdf5 XCFrameworks resolve by URL
    # Not on pull requests: the free plan's macOS runners are scarce, so this runs on main, tags and by hand.
    if: github.event_name != 'pull_request'
    # The org's Mac runner while the org variable MACEM_MAC_RUNNER is set (never for a fork PR); else GitHub's macos-26.
    runs-on: ${{ vars.MACEM_MAC_RUNNER && !github.event.pull_request.head.repo.fork && fromJSON(vars.MACEM_MAC_RUNNER) || 'macos-26' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Resolve the release zips (checksums from Package.swift) and build FormatoHDF5 against them
        run: |
          unset FORMATO_LOCAL_XCFRAMEWORKS
          swift package resolve
          swift build -c release --product FormatoHDF5

  version:
    name: CHANGELOG version matches the tag
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v7
      - name: Compare
        run: |
          top=$(grep -m1 -E '^## \[?v?[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | sed -E 's/^## \[?v?([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          tag=${GITHUB_REF_NAME#v}
          [ "$top" = "$tag" ] || { echo "CHANGELOG top is $top, tag is $tag"; exit 1; }

  private-refs:
    name: No private references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan tracked files
        run: |
          if git grep -n -I -E '_archive|CLAUDE\.md|memcap|macEM-suite|setup-python-refs' -- ':!.gitignore' ':!.github/workflows/ci.yml'; then
            echo "Private references above; this repo is public."; exit 1
          fi

  lint:
    name: Lint (shared SwiftLint and SwiftFormat config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: SwiftLint
        run: docker run --rm -v "$PWD:/work" -w /work --entrypoint swiftlint ghcr.io/realm/swiftlint:0.65.1 lint --strict --quiet
      - name: SwiftFormat
        run: docker run --rm -v "$PWD:/work" -w /work --entrypoint swiftformat ghcr.io/nicklockwood/swiftformat:0.64.4 --lint .
