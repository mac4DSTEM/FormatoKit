# Swift Package Index: which modules get hosted DocC documentation. The package declares macOS 15 / iOS 18 (the shipped
# libhdf5 is arm64 macOS), so the docs build on the Index's macOS SwiftPM builder. Every product with a .docc catalogue is listed.
version: 1
builder:
  configs:
    - platform: macos-spm
      documentation_targets: [Formato, FormatoCore, FormatoDM, FormatoEMD, FormatoHDF5, FormatoTIFF, FormatoMRC, FormatoEMPAD, FormatoMIB, FormatoMSA, FormatoPeek]
